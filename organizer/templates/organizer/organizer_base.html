<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <title>Organizer Portal | UM Engage</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f6f7fb;
        }

        .sidebar {
            min-width: 280px;
            max-width: 280px;
            height: 100vh;
            position: sticky;
            top: 0;
        }

        .nav-pills .nav-link.active {
            font-weight: 700;
            background-color: #f8f9fa;
            color: #0d6efd;
        }

        .nav-link:hover {
            background-color: #f8f9fa;
        }

        .soft-card {
            border: 0;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
        }

        .page-title {
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .status-badge {
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .btn {
            border-radius: 10px;
        }

        .form-control,
        .form-select {
            border-radius: 10px;
            padding: 10px 12px;
        }
    </style>
</head>
{% if messages %}
<div class="position-fixed top-0 end-0 p-4" style="z-index: 2000; margin-top: 70px;">
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm"
             role="alert"
             style="border-radius: 14px; min-width: 320px;">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}
</div>
{% endif %}
<body>
<div class="d-flex">

    <div class="d-flex flex-column flex-shrink-0 p-3 bg-white border-end sidebar">
        <div class="d-flex align-items-center pb-3 mb-3 border-bottom">
            <div class="bg-primary text-white d-flex align-items-center justify-content-center rounded-3 fw-bold"
                 style="width: 42px; height: 42px;">
                OE
            </div>
            <div class="ms-3">
                <h6 class="mb-0 fw-bold">UM Engage</h6>
                <small class="text-secondary text-uppercase fw-semibold" style="font-size: 10px; letter-spacing: 1px;">
                    Organizer Portal
                </small>
            </div>
        </div>

        <div class="text-secondary fw-bold mb-2 ps-2" style="font-size: 11px; letter-spacing: 2px;">
            NAVIGATION
        </div>

        <ul class="nav nav-pills flex-column mb-3">
            <li class="nav-item">
                <a href="{% url 'organizer:dashboard' %}" class="nav-link d-flex align-items-center gap-2 mb-1
                {% if request.resolver_match.url_name == 'dashboard' %}active{% else %}link-dark{% endif %}">
                    <i class="bi bi-grid fs-5"></i>
                    Dashboard
                </a>
            </li>

            <li class="nav-item">
                <a href="{% url 'organizer:events' %}" class="nav-link d-flex align-items-center gap-2 mb-1
                {% if request.resolver_match.url_name == 'events' %}active{% else %}link-dark{% endif %}">
                    <i class="bi bi-calendar-event fs-5"></i>
                    My Events
                </a>
            </li>

            <li class="nav-item">
                <a href="{% url 'organizer:create_event' %}" class="nav-link d-flex align-items-center gap-2 mb-1
                {% if request.resolver_match.url_name == 'create_event' %}active{% else %}link-dark{% endif %}">
                    <i class="bi bi-plus-circle fs-5"></i>
                    Create Event
                </a>
            </li>
        </ul>

        <div class="mt-auto pt-3 border-top">
            <a href="{% url 'accounts:logout' %}" class="nav-link link-danger d-flex align-items-center gap-2 p-2 rounded">
                <i class="bi bi-box-arrow-right fs-5"></i>
                <span>Logout</span>
            </a>
        </div>
    </div>

    <div class="flex-grow-1 d-flex flex-column" style="min-height: 100vh;">
        <main class="p-4 flex-grow-1">
            {% block content %}
            {% endblock %}
        </main>

        <footer class="py-3 text-center text-muted border-top bg-white">
            &copy; 2026 UM Engage System
        </footer>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
