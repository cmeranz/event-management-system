{% extends "accounts/auth_base.html" %}

{% block content %}
<div class="mb-4">
    <h2 class="fw-bold mb-1">Reset your password</h2>
    <p class="text-muted mb-0">Enter your registered email. A reset link will be generated.</p>
</div>

<form method="POST">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        {{ form.email }}
        {% for error in form.email.errors %}
            <div class="field-error">{{ error }}</div>
        {% endfor %}
    </div>

    <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>

    <p class="text-center mt-3 mb-0">
        <a href="{% url 'accounts:login' %}" class="small-link">Back to login</a>
    </p>
</form>
{% endblock %}
