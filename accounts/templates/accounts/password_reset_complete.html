{% extends "accounts/auth_base.html" %}

{% block content %}
<div class="text-center py-4">
    <div class="bg-success-subtle text-success rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
         style="width: 70px; height: 70px;">
        <i class="bi bi-check-circle fs-2"></i>
    </div>

    <h2 class="fw-bold">Password updated</h2>
    <p class="text-muted">
        Your password has been reset successfully. You can now log in using your new password.
    </p>

    <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-3">
        Back to Login
    </a>
</div>
{% endblock %}
