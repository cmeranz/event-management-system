{% extends "accounts/auth_base.html" %}

{% block content %}
<div class="text-center py-4">
    <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
         style="width: 70px; height: 70px;">
        <i class="bi bi-envelope-check fs-2"></i>
    </div>

    <h2 class="fw-bold">Check your email</h2>
    <p class="text-muted">
        A password reset link has been generated. 
    </p>

    <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-3">Back to Login</a>
</div>
{% endblock %}
